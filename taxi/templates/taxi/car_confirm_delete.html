{% extends "taxi/base.html" %}

{% block title %}Delete car{% endblock %}

{% block content %}
<div class="card">
    <h2>Delete car</h2>

    <p>Are you sure you want to delete <strong>{{ object.model }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <a href="{% url 'car-detail' object.id %}">Cancel</a>
</div>
{% endblock %}
